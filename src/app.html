<!DOCTYPE html>
<html lang="%sveltekit.lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#5d4a1e" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- PWA / iOS -->
    <meta name="application-name" content="Cyprus 2026" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cyprus 2026" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Twitter - site-wide defaults; individual pages may override -->
    <meta property="og:site_name" content="Cyprus 2026 Elections" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cyprus Parliamentary Elections 2026" />
    <meta property="og:description" content="How parliament is really chosen, and why polls don’t tell the whole story. An interactive explainer in English &amp; Greek." />
    <meta property="og:image" content="%sveltekit.assets%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cyprus 2026 Parliamentary Elections · interactive explainer" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="el_GR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cyprus Parliamentary Elections 2026" />
    <meta name="twitter:description" content="How parliament is really chosen, and why polls don’t tell the whole story." />
    <meta name="twitter:image" content="%sveltekit.assets%/og-image.png" />
    <meta name="twitter:image:alt" content="Cyprus 2026 Parliamentary Elections · interactive explainer" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
